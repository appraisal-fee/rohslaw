<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장애정도 판정기준 길잡이</title>
<meta name="theme-color" content="#1f4c8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 정확한 진료실 문서 — 의사에게는 빠르게, 민원 상담 직원에게는 쉽게
   IDEA: 장애정도심사용 진단서 한 장 — 칸이 반듯한 공문 서식처럼 움직이는 도구
   PICTURE: 입력하면 바로 찍히는 판정 도장(심한/심하지 않은/해당 없음)
   COLOUR and TYPE: 흰 종이, 공문 청색 #1f4c8f, 도장 적색 #c32f3b / IBM Plex Sans KR
   LAYOUT: 상단 청색 띠 → 유형 칩 → 왼쪽 입력, 오른쪽 판정 도장(좁으면 위아래) */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#10151c);--paper:light-dark(#f4f6f9,#171e28);--line:light-dark(#d5dbe3,#2c3746);
--ink:light-dark(#17202b,#e7ecf2);--mute:light-dark(#566273,#9aa7b8);
--blue:light-dark(#1f4c8f,#7fa8e8);--blueBg:light-dark(#1f4c8f,#16294a);--blueSoft:light-dark(#e6eefa,#1b2a42);
--red:light-dark(#c32f3b,#ff7a84);--redSoft:light-dark(#fbe9ea,#3a1d22);--ok:light-dark(#4b5563,#aab3bf)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--blueBg);color:#fff}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header h1{cursor:pointer;margin:0;font-size:clamp(24px,3.4vw,36px);line-height:1.1;font-weight:700;text-wrap:balance}
header p{margin:6px 0 0;opacity:.85;font-size:14px}
.modeSw{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:10px;overflow:hidden}
.modeSw button{border:0;background:transparent;color:#fff;padding:0 18px;min-height:44px;cursor:pointer;font-weight:600}
.modeSw button[aria-pressed=true]{background:#fff;color:#1f4c8f}
.hidden{display:none!important}
/* 첫 화면 */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:960px;margin:0 auto}
.pickCard{border:1px solid var(--line);border-radius:14px;padding:28px;background:var(--paper);text-align:left;cursor:pointer;display:grid;gap:10px;min-height:220px;align-content:start}
.pickCard:hover,.pickCard:focus-visible{border-color:var(--blue);outline:2px solid var(--blue)}
.pickCard b{font-size:24px;color:var(--blue)}
.pickCard ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px}
.intro{max-width:960px;margin:0 auto 20px;color:var(--mute)}
/* 유형 칩 */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:44px;padding:6px 8px;cursor:pointer;font-size:15px;font-weight:500;text-align:center}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.chip small{display:block;font-size:12px;opacity:.75;font-weight:400}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 280px;display:flex;gap:8px}
.search input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
/* 탭 */
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--blue);margin:20px 0 0}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--paper);min-height:44px;padding:0 16px;cursor:pointer;margin-right:-1px;border-radius:8px 8px 0 0;font-weight:500}
.tab[aria-selected=true]{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.panel{border:1px solid var(--line);border-top:0;padding:clamp(16px,2.4vw,28px);background:var(--bg);border-radius:0 0 10px 10px}
h2{font-size:28px;line-height:1.15;margin:0 0 6px}
h3{font-size:19px;margin:22px 0 8px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
/* 판정 계산 */
.calc{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:13em minmax(0,1fr);gap:10px;align-items:center}
.row>label,.row>.lab{font-size:15px;color:var(--ink);font-weight:500}
.row input[type=text],.row input[type=number],.row select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);font-size:16px;text-align:left}
.row input[type=number]{text-align:right}
.unit{display:grid;grid-template-columns:minmax(0,1fr) 4.5em;gap:8px;align-items:center}
.unit span{color:var(--mute);font-size:14px;white-space:nowrap}
.chk{display:flex;gap:10px;align-items:center;min-height:40px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none}
.grp{font-weight:700;color:var(--blue);margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.ear{display:grid;grid-template-columns:4em repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.ear div{font-size:13px;color:var(--mute);text-align:center}
.ear input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 6px;text-align:right;background:var(--bg)}
.ear b{font-size:14px}
.picklist{display:grid;gap:6px;max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.picklist label{display:grid;grid-template-columns:22px 5.6em minmax(0,1fr);gap:8px;align-items:start;padding:6px;border-radius:6px;cursor:pointer;font-size:15px}
.picklist label:hover{background:var(--paper)}
.picklist input{width:20px;height:20px;margin:2px 0 0}
.tag{display:inline-block;font-size:12px;border-radius:4px;padding:1px 6px;font-weight:600;text-align:center;white-space:nowrap}
.tS{background:var(--redSoft);color:var(--red)}.tM{background:var(--blueSoft);color:var(--blue)}
.stampBox{position:sticky;top:12px;border:2px solid var(--line);border-radius:14px;padding:22px;background:var(--paper);display:grid;gap:12px}
.stamp{width:min(220px,70%);aspect-ratio:1;border-radius:50%;border:6px double currentColor;display:grid;place-items:center;text-align:center;margin:4px auto;font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.2;transform:rotate(-8deg);transition:transform .35s}
.stamp.S{color:var(--red)}.stamp.M{color:var(--blue)}.stamp.N,.stamp.P{color:var(--ok)}
.stamp span{display:block;font-size:13px;font-weight:500;margin-top:4px}
@media(prefers-reduced-motion:no-preference){.stamp.pop{animation:pop .35s}}
@keyframes pop{from{transform:rotate(-8deg) scale(1.25);opacity:.3}to{transform:rotate(-8deg) scale(1);opacity:1}}
.basis{margin:0;padding-left:18px;font-size:15px}
.warn{background:var(--redSoft);color:var(--red);border-radius:8px;padding:8px 12px;font-size:14px}
.note{font-size:13px;color:var(--mute)}
.btn{min-height:44px;border:1px solid var(--blue);background:var(--blue);color:var(--bg);border-radius:8px;padding:0 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--blue)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);font-size:15px;line-height:1.6}
/* 표 */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--paper);font-weight:600}
td.no{width:4.5em;text-align:center;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--paper)}
.box h3{margin-top:0}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:3px 0}
.checklist label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checklist input{width:20px;height:20px;margin:3px 0 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--blue);color:var(--bg);display:grid;place-items:center;font-weight:700}
.easy{font-size:17px;line-height:1.75}
.res{display:grid;gap:8px}
.res button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:7em 5.6em minmax(0,1fr);gap:8px;font-size:15px}
.logrow{display:grid;grid-template-columns:9em minmax(0,1fr) 44px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.logrow button{min-height:36px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer}
footer a{color:inherit}
footer{color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tools{display:flex;gap:8px}
.btnRow{display:flex;flex-wrap:wrap;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.quick:empty{display:none}.ql{font-size:13px;color:var(--mute);margin:0 4px 0 6px}.chip.qk{min-height:36px;padding:2px 12px;font-size:14px}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}.phead h2{margin:0}
.star{min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 12px;cursor:pointer;font-size:14px;color:var(--blue);font-weight:600}.star[aria-pressed=true]{background:var(--blueSoft);border-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(10,16,24,.55);display:grid;place-items:center;z-index:60;padding:16px}.mbox{background:var(--bg);color:var(--ink);border-radius:14px;padding:22px;max-width:480px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.viewer{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;font-size:19px}
.vbar{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px max(4vw,16px);background:var(--blueBg);z-index:2}
.vbar .btn.ghost{background:#fff;color:#1f4c8f;border-color:#fff}.vl button{min-height:44px}
.vbody{max-width:1000px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,16px)}.vbody h1{font-size:clamp(30px,4vw,44px);margin:0 0 4px;line-height:1.1}.vbody h2{font-size:24px;margin:0 0 10px}.vt{font-size:22px;font-weight:600;color:var(--blue);margin:0 0 18px}
.vbody .clean li{margin:6px 0}.steps.big li{grid-template-columns:48px minmax(0,1fr);font-size:19px}.steps.big li::before{width:42px;height:42px;font-size:20px}
.srcs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.src{display:inline-grid;gap:0;border:1px solid var(--blue);border-radius:8px;padding:5px 12px;min-height:44px;align-content:center;text-decoration:none;color:var(--blue);background:var(--bg)}
.src b{font-size:14px}.src span{font-size:12px;color:var(--mute)}.src:hover{background:var(--blueSoft)}
footer a{color:inherit}
.bar{display:grid;grid-template-columns:8em minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:14px;margin:6px 0}.bar b{text-align:right}
.micwrap{position:relative;display:block}.micwrap>input,.micwrap>textarea{width:100%;padding-right:84px!important}.micwrap .mic{position:absolute;right:4px;top:4px;min-height:36px;padding:0 10px;font-size:14px;white-space:nowrap;background:var(--bg)}
.tools button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:600}
.tools button[aria-pressed=true]{background:#fff;color:#1f4c8f}
.big main{zoom:1.22}
.edge{border:2px dashed var(--blue);border-radius:8px;padding:8px 12px;font-size:14px;background:var(--blueSoft)}
.edge b{display:block;color:var(--blue)}
.nu{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);display:grid;gap:8px;margin-bottom:6px}
.nu textarea{min-height:90px;font-size:14px}
.filled{outline:3px solid var(--red)!important;outline-offset:1px}
.save{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.save input{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}
.risk{font-size:22px;font-weight:700}.risk.hi{color:var(--red)}.risk.mid{color:var(--blue)}.risk.lo{color:var(--ok)}
.qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:14px;max-width:440px;margin:0 auto}.qr svg{width:100%;height:auto}
.card{border:2px solid var(--blue);border-radius:14px;padding:clamp(16px,3vw,28px);background:var(--bg)}
.card h3:first-child{margin-top:0}
.find label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}
.find input{width:22px;height:22px;margin:3px 0 0}
.dup{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.parts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px 32px}
.parts .chk{min-height:32px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;z-index:9;max-width:90vw}
td.num,th.num{text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:14px}
.fc{display:grid;max-width:1000px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,.9fr);align-items:stretch}
.fn{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.fn b,.fs b{display:inline;font-size:17px}.fn small,.fs small{display:block;font-size:14px;color:var(--mute);margin-top:4px;line-height:1.55}
.fn em,.fs em{display:inline-block;font-style:normal;font-size:13px;font-weight:600;color:var(--blue);margin-top:6px}
.fn .no{width:30px;height:30px;border-radius:50%;background:var(--blue);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.fn.ask{border:2px dashed var(--blue);background:var(--bg)}
.fn .qm{position:relative;width:30px;height:30px;display:grid;place-items:center;color:var(--blue);font-weight:700}.fn .qm::before{content:"";position:absolute;inset:4px;border:2px solid var(--blue);transform:rotate(45deg);background:var(--bg);z-index:-1}.fn .qm{z-index:0}.fn.ask{position:relative;z-index:0}
.fn.pill{display:block;text-align:center;border-radius:999px;background:var(--blue);border-color:var(--blue);color:var(--bg);padding:12px 22px}
.fn.pill small{color:var(--bg);opacity:.85}
.fa{position:relative;display:grid;place-items:center}
.fa::before{content:"";position:absolute;left:6px;right:12px;top:50%;border-top:2px solid var(--red)}
.fa::after{content:"";position:absolute;right:4px;top:calc(50% - 6px);border:6px solid transparent;border-left:9px solid var(--red)}
.fa span{position:relative;top:-14px;font-size:13px;font-weight:700;color:var(--red);background:var(--bg);padding:0 4px}
.fs{border:2px solid var(--red);border-radius:12px;padding:12px 14px;background:var(--redSoft)}
.fs em{color:var(--red)}
.fd{position:relative;height:40px}
.fd::before{content:"";position:absolute;left:31px;top:0;bottom:8px;border-left:2px solid var(--mute)}
.fd::after{content:"";position:absolute;left:26px;bottom:0;border:6px solid transparent;border-top:9px solid var(--mute)}
.fd span{position:absolute;left:42px;top:9px;font-size:13px;font-weight:700;color:var(--blue)}

@media(max-width:860px){.calc{grid-template-columns:minmax(0,1fr)}.stampBox{position:static;order:-1}.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.pick{grid-template-columns:minmax(0,1fr)}
 .srcs{display:grid;grid-template-columns:minmax(0,1fr)}.src{display:grid}
 .vbar .btns{width:100%}.vbar .btns .btn{flex:1}.vl{width:100%}.vl button{flex:1;padding:0 4px;font-size:14px}
 .frow{grid-template-columns:minmax(0,1fr)}.frow>div:empty{display:none}
 .fa{height:30px;place-items:start;padding-left:22px}.fa::before{left:31px;right:auto;top:0;bottom:6px;border-top:0;border-left:2px solid var(--red)}.fa::after{left:26px;right:auto;top:auto;bottom:-6px;border:6px solid transparent;border-top:9px solid var(--red)}.fa span{top:4px;left:20px}
 .fs{margin:6px 0 0 16px}
 .fa span::after{content:"라면"}.fd span:not(:empty)::after{content:"라면 다음 단계로"}.fd{height:44px}

.btnRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}.btnRow .btn{padding:0 4px;font-size:15px}.btnRow .hidden{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-bottom-width:2px}.tab{margin:0;padding:0 4px;font-size:14px;border-radius:6px 6px 0 0;border-bottom:0}
.stamp{width:min(170px,60%);font-size:22px}.stampBox{padding:16px}.row{grid-template-columns:minmax(0,1fr);gap:4px}
.res button{grid-template-columns:minmax(0,1fr)}.logrow{grid-template-columns:minmax(0,1fr) 44px}.logrow span:first-child{grid-column:1/-1}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:6em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:5.5em;margin-inline-start:-6em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}
.ear{grid-template-columns:3em repeat(4,minmax(0,1fr))}}
@media print{header .modeSw,.tabs,.toolbar,.types,.btns{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band"><div class="wrap">
  <div><h1 id="homeTitle" title="첫 화면으로">장애정도 판정기준 길잡이</h1>
  <p>보건복지부 고시 제2025-228호 「장애정도판정기준」 · 16개 장애유형(2026. 7. 1. 췌장장애 신설 반영)</p></div>
  <div class="tools hidden" id="tools"><button type="button" id="homeBtn" title="첫 화면으로 (Esc)">처음으로</button><button type="button" id="bigBtn" aria-pressed="false">큰 글씨</button><button type="button" id="ttsBtn" aria-pressed="false">읽어 주기</button></div>
  <div class="modeSw hidden" id="modeSw" role="group" aria-label="사용자 선택">
    <button type="button" data-mode="doctor" aria-pressed="false">의사용</button>
    <button type="button" data-mode="family" aria-pressed="false">직원용</button>
  </div>
</div></header>

<main>
<section class="band" id="start">
  <p class="intro">누가 사용하시나요? 고른 화면은 다음에 열 때도 그대로 열립니다. 위쪽 단추로 언제든 바꿀 수 있습니다.</p>
  <div class="pick">
    <button class="pickCard" type="button" data-mode="doctor"><b>의사용</b>
      <span>장애정도심사용 진단서를 쓰는 전문의를 위한 화면</span>
      <ul><li>진료기록으로 유형 찾기·수치 자동 채우기</li><li>측정값 입력 → 장애정도 자동 판정</li><li>판정기준 원문 검색</li><li>진단서 기재사항·소견 문구 초안</li><li>진단 시기·진단 가능 전문의</li><li>의무기록·검사결과지 준비물</li></ul></button>
    <button class="pickCard" type="button" data-mode="family"><b>직원용 (민원 상담)</b>
      <span>원무·민원 창구 직원이 장애 진단·등록 민원을 상담할 때 쓰는 화면</span>
      <ul><li>진단서·소견서 내용으로 유형 찾기</li><li>민원인에게 기준을 쉬운 말로 설명</li><li>검사 숫자로 예상 정도 확인</li><li>진단 가능일·이의신청 기한 계산</li><li>상담 안내문 복사·상담 기록</li></ul></button>
  </div>
</section>

<section class="band hidden" id="app"><div class="wrap">
  <div class="toolbar">
    <div class="btnRow"><button type="button" class="btn" id="recBtn" aria-pressed="false" title="진료기록·소견서로 장애유형 찾기">기록으로 찾기</button><button type="button" class="btn ghost" id="procBtn" aria-pressed="false">판정 절차</button><button type="button" class="btn ghost" id="sessBtn" aria-pressed="false">상담 시작</button><button type="button" class="btn ghost" id="showBtn" title="민원인에게 보여 주는 큰 글씨 안내 화면(다국어)">민원인 화면</button></div>
    <div class="search"><input id="q" type="search" placeholder="기준 검색: 예) 바델, 투석, 0.02, 근력등급 3" aria-label="판정기준 검색"><button class="btn" id="qBtn" type="button">검색</button></div>
  </div>
  <div id="qRes" class="res hidden"></div>
  <div id="rec" class="hidden" style="margin-bottom:16px"></div>
  <div id="procSec" class="hidden" style="margin-bottom:16px"></div>
  <div class="quick" id="quick"></div>
  <div class="types" id="types" role="group" aria-label="장애유형"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel" id="panel" role="tabpanel"></div>
</div></section>
</main>

<footer class="band"><div class="wrap">
  <span>참고용 도구입니다. 장애정도는 국민연금공단의 심사(2인 이상 전문의 자문회의)를 거쳐 결정되며, 세부 판정은 고시 원문을 확인하세요.</span>

const NU={

};
function nuParse(key,txt){const out={},m=NU[key];if(!m||!txt.trim())return out;
 if(key==='ear')return parseEar(txt);
 if(key==='mbi'){['개인\\s*위생','목욕','식사','용변','계단','옷','대변','소변','보행|휠체어','이동|의자|침대'].forEach((l,i)=>{const r=txt.match(new RegExp('(?:'+l+')[^\\d\\n]{0,12}(\\d{1,2})'));if(r&&MBI[i][1].includes(+r[1]))out['b'+i]=r[1]});return out}
 if(key==='kidney'){const r=txt.match(/(?:최초\s*투석|투석\s*시작|first\s*dialysis)[^\d\n]{0,15}(\d{4})[.\-\/년\s]*(\d{1,2})[.\-\/월\s]*(\d{1,2})/i);if(r)out.d0=r[1]+'-'+r[2].padStart(2,'0')+'-'+r[3].padStart(2,'0');return out}
 Object.keys(m).forEach(k=>{if(k[0]==='_')return;const re=typeof m[k]==='string'?new RegExp('(?:'+m[k]+')[^0-9\\n]{0,30}?(\\d+(?:\\.\\d+)?)','i'):m[k];const r=txt.match(re);if(r)out[k]=r[1]});return out}
function parseEar(txt){if(!/dB|Hz|청력|PTA|순음|audiogram/i.test(txt))return {};const out={},F=[125,250,500,750,1000,1500,2000,3000,4000,6000,8000];
 const t=txt.replace(/\bNR\b|무반응|scale\s*out|S\/O/gi,' 100 '),lines=t.split(/\n/);let head=null;
 const fq=s=>{const r=s.match(/^(\d+(?:\.\d+)?)(k)?(?:hz)?$/i);if(!r)return NaN;const v=+r[1]*(r[2]?1000:1);return F.includes(v)?v:NaN};
 for(const l of lines){const f=l.split(/[\s,|\t]+/).map(fq).filter(x=>!isNaN(x));if(f.length>=3){head=f;break}}
 const isR=l=>/(\bR(?:t|ight)?\b|우측|우\s|오른)/i.test(l),isL=l=>/(\bL(?:t|eft)?\b|좌측|좌\s|왼)/i.test(l);
 for(const l of lines){if(/SDS|WRS|명료|speech/i.test(l)){const a=l.match(/(?:\bR(?:t|ight)?\b|우|오른)[^\d\n]{0,8}(\d{1,3})\s*%/i),b=l.match(/(?:\bL(?:t|eft)?\b|좌|왼)[^\d\n]{0,8}(\d{1,3})\s*%/i);
   if(a)out.sr=a[1];if(b)out.sl=b[1];if(!a&&!b){const p=l.match(/(\d{1,3})\s*%/g);if(p&&p.length>=2){out.sr=parseInt(p[0]);out.sl=parseInt(p[1])}}continue}
  if(/\bBC\b|골도|bone|masking/i.test(l))continue;const side=isR(l)&&!isL(l)?'r':isL(l)&&!isR(l)?'l':null;if(!side||out[side+'500']!=null)continue;
  const nums=(l.replace(/^[^\d-]*/,'').match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);const order=head||[500,1000,2000,4000];
  [[500,'500'],[1000,'1k'],[2000,'2k'],[4000,'4k']].forEach(([f,k])=>{const i=order.indexOf(f);if(i>=0&&nums[i]!=null)out[side+k]=String(nums[i])})}
 return out}

function qrCompact(t,n){const c=x=>{x=x.replace(/\s*\([^)]*\)/g,'');return x.length>n?x.slice(0,n-1)+'…':x};
 return '[장애인 등록 준비물] '+t.name+'\n공통: 신청서, 사진 1장, 신분증, 장애정도심사용 진단서\n'+(t.tests.length?'검사: '+t.tests.map(c).join(' / ')+'\n':'')+'기록: '+t.recs.map(c).join(' / ')+'\n신청: 주민센터 · 문의 1355'}

function recLocal(txt){const out=[];

    if(NEG_AFTER.test(after)||NEG_BEFORE.test(before)){if(!seen.has('n'+key)){seen.add('n'+key);neg.push(snip(txt,m.index,m[0].length))}continue}
    if(seen.has(key))continue;seen.add(key);score+=w;ev.push({k:kind,w:m[0],s:snip(txt,m.index,m[0].length)});if(m[0].length===0)re.lastIndex++}};

 vi:{title:'Hướng dẫn đăng ký người khuyết tật',steps:'Các bước',bring:'Cần chuẩn bị',tdocs:'Giấy tờ bệnh viện cho loại khuyết tật này',close:'Đóng',copy:'Sao chép hướng dẫn',note:'Danh sách này bằng tiếng Hàn. Vui lòng đưa cho nhân viên bệnh viện xem.',

 '<div class="vbody"><h1>'+L.title+'</h1><p class="vt">'+esc(tName(t,vLang))+(vLang==='ko'?'':' · '+t.name)+'</p>'+
 (vLang==='ko'?flowHTML():'<h2>'+L.steps+'</h2><ol class="steps big">'+L.s.map(x=>'<li><div><b>'+x[0]+'</b><br>'+x[1]+'</div></li>').join('')+'</ol>')+
 '<div class="cols" style="margin-top:24px"><div class="box"><h2>'+L.bring+'</h2><ul class="clean">'+L.b.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="box"><h2>'+L.tdocs+'</h2><ul class="clean">'+docs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(vLang!=='ko'&&!vTr[t.id+vLang]?'<p class="note">'+L.note+'</p>'+(SAMPLE?'<button type="button" class="btn ghost" id="vTrans">이 목록 번역(Claude)</button>':''):'')+'</div></div><p class="vt" style="margin-top:20px">'+L.contact+'</p></div>'}

 const tr=$('#vTrans');if(tr)tr.onclick=async()=>{const t=ty(),l=vLang,src=t.tests.concat(t.recs);tr.disabled=true;tr.textContent='번역 중…';
  try{const r=await SAMPLE('Translate each line of this Korean list of hospital documents for disability registration into '+{en:'English',zh:'Simplified Chinese',vi:'Vietnamese'}[l]+'. Keep medical test names accurate. Return only the translated lines, one per line, same order, no numbering.\n\n'+src.join('\n'),{modelTier:'quick'});
   const lines=String(r.text).split('\n').map(x=>x.replace(/^[-•\d.\s]+/,'').trim()).filter(Boolean);if(lines.length)vTr[t.id+l]=lines.slice(0,src.length);openViewer()}
  catch(e){tr.disabled=false;tr.textContent='이 목록 번역(Claude)';toast(e&&e.code==='rate_limited'?'잠시 후 다시 시도하세요.':'번역하지 못했습니다.')}}}

 if(!$('#rec').classList.contains('hidden'))toggleRec();if(!$('#procSec').classList.contains('hidden'))toggleProc();

function smsHTML(t){const tm=store.get('tim_'+t.id,null),c=['[장애등록 안내] '+t.name+': 병원 진단서·서류 발급 후 주소지 주민센터 신청. 문의 1355',t.name+': 진단서·서류 발급 후 주민센터 신청. 문의1355','장애등록: 진단서 발급 후 주민센터 신청, 문의1355'];
 let s=c.find(x=>bytesOf(x)<=90)||cutBytes(c[2],90);if(tm&&tm.date&&tm.date!=='즉시'&&bytesOf(s+' 진단가능 '+tm.date)<=90)s+=' 진단가능 '+tm.date;
 const full=cardText(t),long=bytesOf(full)>2000?cutBytes(full,1960)+'\n…(나머지는 창구 문의)':full;

function bindSms(){const S=$('#smsS');if(!S)return;const L=$('#smsL');S.oninput=()=>{const b=bytesOf(S.value);$('#smsSB').textContent=b+' / 90바이트'+(b>90?' — 초과':'')};L.oninput=()=>{const b=bytesOf(L.value);$('#smsLB').textContent=b+' / 2,000바이트'+(b>2000?' — 초과':'')};$('#smsSC').onclick=()=>copyText(S.value,S);$('#smsLC').onclick=()=>copyText(L.value,L)}

/* 상담 통계 */
function statHTML(){const L=store.get('log',[]);if(!L.length)return '';const mf=store.get('stM','');const months=[...new Set(L.map(x=>(x.d||'').slice(0,7)))].filter(Boolean).sort().reverse();const F=L.filter(x=>!mf||(x.d||'').startsWith(mf));
 const by={};F.forEach(x=>{const k=x.ty||'미지정';by[k]=(by[k]||0)+1});const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1,withNext=F.filter(x=>x.next).length;
 const mm={};L.forEach(x=>{const m=(x.d||'').slice(0,7);if(m)mm[m]=(mm[m]||0)+1});
 return '<h3>상담 통계</h3><div class="cols"><div class="box"><div class="row"><label for="stM">기간</label><select id="stM"><option value="">전체 기간</option>'+months.map(m=>'<option'+(m===mf?' selected':'')+'>'+m+'</option>').join('')+'</select></div><p class="risk mid" style="margin:10px 0 4px">'+F.length+'건</p><p class="note">후속 조치를 적은 상담 '+withNext+'건 ('+(F.length?Math.round(withNext/F.length*100):0)+'%)</p>'+
 rows.map(([k,n])=>'<div class="bar"><span>'+esc(k)+'</span><div class="meter"><i style="width:'+Math.round(n/max*100)+'%"></i></div><b>'+n+'</b></div>').join('')+'</div>'+
 '<div class="box"><h3>월별 건수</h3><table><thead><tr><th>월</th><th class="num">건수</th></tr></thead><tbody>'+Object.keys(mm).sort().reverse().slice(0,12).map(m=>'<tr><td>'+m+'</td><td class="num">'+mm[m]+'</td></tr>').join('')+'</tbody></table><div class="btns" style="margin-top:10px"><button type="button" class="btn" id="stCopy">보고용 표 복사</button></div><p class="note">월×장애유형 표로 복사되어 엑셀에 바로 붙습니다.</p></div></div>'}
function statTSV(){const L=store.get('log',[]),ms=[...new Set(L.map(x=>(x.d||'').slice(0,7)))].filter(Boolean).sort(),ts=T.map(t=>t.name).filter(n=>L.some(x=>x.ty===n));
 return ['월\t'+ts.join('\t')+'\t합계'].concat(ms.map(m=>{const r=ts.map(n=>L.filter(x=>x.ty===n&&x.d.startsWith(m)).length);return m+'\t'+r.join('\t')+'\t'+L.filter(x=>x.d.startsWith(m)).length})).join('\n')}
function bindStat(){const s=$('#stM');if(!s)return;s.onchange=()=>{store.set('stM',s.value);const y=scrollY;render();scrollTo(0,y)};$('#stCopy').onclick=()=>copyText(statTSV())}

let DICT=null,micEl=null,micBtn=null;
function micSet(on){document.querySelectorAll('.mic').forEach(b=>{const a=on&&b===micBtn;b.textContent=a?'멈춤':'말하기';b.setAttribute('aria-pressed',a)})}
function attachMics(){if(!DICT)return;['#lgT','#lgN','#lgW','#recTxt','#cdMemo','#syM','#aiTxt'].forEach(s=>{const el=$(s);if(!el||el.dataset.mic)return;el.dataset.mic='1';const b=document.createElement('button');b.type='button';b.className='btn ghost mic';b.textContent='말하기';b.setAttribute('aria-label','음성으로 입력');
  b.onclick=()=>{if(micBtn===b){DICT.stop().catch(()=>{});return}micEl=el;micBtn=b;DICT.start().catch(e=>{micBtn=null;micSet(false);toast(e&&e.code==='not_granted'?'마이크 사용이 허용되지 않았습니다. 글로 입력하세요.':'음성 입력을 시작하지 못했습니다.')});micSet(true)};
  const w=document.createElement('div');w.className='micwrap';el.parentNode.insertBefore(w,el);w.appendChild(el);w.appendChild(b)})}
(async()=>{try{if(window.claude&&typeof claude.use==='function'){DICT=await claude.use('dictation');if(DICT){
 DICT.onFinal(({text})=>{if(!micEl||!text)return;micEl.value=(micEl.value&&!/\s$/.test(micEl.value)?micEl.value+' ':micEl.value)+text;micEl.dispatchEvent(new Event('input',{bubbles:true}))});
 DICT.onState(({state})=>{if(state!=='listening'){micBtn=null;micSet(false)}});attachMics()}}}catch(e){DICT=null}})();

 T.forEach(t=>{t.sec.forEach(s=>{[[S,s.s],[M,s.m]].forEach(([lv,a])=>a.forEach((x,i)=>{if((s.t+x).includes(q))out.push({t,lv,txt:s.t+' '+(i+1)+'호 — '+x})}))});
