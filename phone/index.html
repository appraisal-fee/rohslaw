<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>원내 전화번호 검색 · 부천성모병원</title>
<style>
:root{
  --navy:#1f3a5f; --navy2:#2b4f7e; --teal:#0f8a83; --bg:#f3f5f8; --card:#fff;
  --line:#dde3ea; --text:#1c2430; --muted:#6b7684; --hl:#fff1a8; --star:#f2a900; --mine:#7b4fd6; --share:#1e7bc8;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:15px}
button,input,select,textarea{font:inherit}
.tnum{font-variant-numeric:tabular-nums}

header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 20px 14px}
.hwrap{max-width:1400px;margin:0 auto}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.htop h1{margin:0;font-size:21px;letter-spacing:-.3px}
.base{font-size:13px;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px}
.hinfo{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);border:0;
  border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;font-weight:600}
.pill b{font-weight:700;color:var(--teal)}
.cmc{margin-top:8px;font-size:12.5px;opacity:.85;line-height:1.5}

.searchbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.swrap{max-width:1400px;margin:0 auto;padding:12px 20px 10px}
.srow{display:flex;gap:8px;align-items:center}
.sbox{flex:1;position:relative}
.sbox input{width:100%;height:48px;border:2px solid var(--navy2);border-radius:12px;padding:0 44px 0 16px;
  font-size:17px;outline:none;background:#fff}
.sbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,138,131,.15)}
.sclear{position:absolute;right:8px;top:8px;width:32px;height:32px;border:0;border-radius:8px;background:#eef1f5;
  cursor:pointer;color:var(--muted);font-size:16px;display:none}
.btn{height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;
  white-space:nowrap;font-weight:600;color:var(--navy)}
.btn:hover{background:#eef3f8}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:#33404f}
.chip .c{color:var(--muted);font-size:12px;margin-left:4px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .c{color:#cbd6e4}
.chip.chg{border-color:#f0b54a}
.status{margin-top:8px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:28px}
.status .notice{color:#8a5a00;background:#fff4d6;border-radius:6px;padding:2px 8px;margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 12px;font-size:13px;cursor:pointer;color:#33404f}
.seg button.on{background:var(--navy);color:#fff}
.sharebar{display:none;margin-top:8px;font-size:13px;border-radius:8px;padding:6px 10px;align-items:center;gap:8px}
.sharebar.show{display:flex}
.sharebar.warnb{background:#fff4d6;color:#7a5200}
.sharebar.okb{background:#e8f3fc;color:#1b5f98}
.sharebar button{border:1px solid currentColor;background:#fff;color:inherit;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px;font-weight:600}

main{max-width:1400px;margin:0 auto;padding:14px 20px 40px}
.grid{columns:3 380px;column-gap:14px}
.grid.flat{columns:1;max-width:880px;margin:0 auto}
.group{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin:0 0 14px;overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f7f9fb;border-bottom:1px solid var(--line)}
.gh .path{font-weight:700;color:var(--navy);font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .path .div{color:var(--muted);font-weight:600}
.gh .path .sep{color:#aab4c0;margin:0 4px}
.gh .cnt{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.gh.mine{background:#f4effd}.gh.mine .path{color:var(--mine)}
.gh.share{background:#eaf3fc}.gh.share .path{color:var(--share)}
.gh.hot{background:#fff8e6}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:6px;
  padding:6px 12px 6px 6px;border-bottom:1px solid #eef1f4;min-height:44px}
.row:last-child{border-bottom:0}
.row:hover{background:#fafcfe}
.row.sel{background:#e9f6f5;box-shadow:inset 3px 0 0 var(--teal)}
.star,.more{width:30px;height:30px;border:0;background:none;cursor:pointer;border-radius:6px;font-size:17px;color:#c4ccd6;padding:0}
.star.on{color:var(--star)}
.star:hover,.more:hover{background:#eef2f6}
.more{font-size:15px;color:#9aa5b2}
.nm{min-width:0}
.nm .n{font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.nm .sub{font-size:12px;color:var(--muted);margin-top:1px}
.nm .memo{font-size:12px;color:var(--teal);margin-top:1px}
.nm .note{display:inline-block;font-size:11.5px;color:#8a5a00;background:#fff4d6;border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500}
.tag{display:inline-block;font-size:11px;color:#fff;background:var(--mine);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;font-weight:600}
.tag.sh{background:var(--share)}
.tag.new{background:#1f9d55}.tag.chg{background:#e08a00}
.nums{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:240px}
.num{min-width:62px;height:32px;padding:0 9px;border:1px solid #cfd8e3;background:#f2f6fa;border-radius:7px;cursor:pointer;
  font-weight:700;color:var(--navy);font-size:15px;font-variant-numeric:tabular-nums;text-align:center}
.num:hover{background:var(--teal);border-color:var(--teal);color:#fff}
.num.none{background:none;border-style:dashed;color:var(--muted);font-weight:500;cursor:default}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);column-span:all}
.empty b{color:var(--text)}

.quick{column-span:all;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;
  display:grid;grid-template-columns:92px 1fr;gap:8px 10px;align-items:start}
.quick .lb{font-size:13px;color:var(--muted);font-weight:600;padding-top:5px}
.quick .qs{display:flex;flex-wrap:wrap;gap:6px}
.qb{border:1px solid #cfe3e1;background:#f0f8f7;color:#0b6d67;border-radius:16px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.qb:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.qb.rc{border-color:var(--line);background:#f6f7f9;color:#3b4756}
.qb .xx{margin-left:6px;color:#9aa5b2}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 20px 30px}

.dim{position:fixed;inset:0;background:rgba(18,28,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.dim.show{display:flex}
.dlg{background:#fff;border-radius:14px;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.wide{width:min(860px,100%)}
.dlg h2{margin:0;padding:16px 20px;font-size:17px;border-bottom:1px solid var(--line);color:var(--navy);display:flex;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.dlg h2 .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.dbody{padding:16px 20px}
.form{display:grid;grid-template-columns:88px 1fr;gap:10px 12px;align-items:center}
.form label{font-weight:600;font-size:14px;color:#3b4756;text-align:right}
.form input,.form textarea{width:100%;height:40px;border:1px solid #cdd5df;border-radius:8px;padding:0 10px;outline:none}
.form textarea{height:64px;padding:8px 10px;resize:vertical}
.form input:focus,.form textarea:focus{border-color:var(--teal)}
.form input[readonly]{background:#f3f5f8;color:#556}
.form .hint{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
.radios{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.radios label{font-weight:500;text-align:left;display:flex;align-items:center;gap:5px;cursor:pointer}
.radios input{width:auto;height:auto}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line)}
.dfoot .btn{height:40px}
.dfoot .del{margin-right:auto;color:#c0392b;border-color:#f0c9c4}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sec h3{margin:0 0 6px;font-size:14.5px;color:var(--navy)}
.sec p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.55}
.sec .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec .btn{height:38px;font-size:13.5px}
.sec textarea{width:100%;min-height:120px;border:1px solid #cdd5df;border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.6;outline:none;resize:vertical}
.sec input.me{height:38px;border:1px solid #cdd5df;border-radius:8px;padding:0 10px;width:160px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13.5px;margin-bottom:10px}
.kv span:nth-child(odd){color:var(--muted)}
details{font-size:12.5px;color:var(--muted);margin-top:8px}
details summary{cursor:pointer}
details .al{max-height:200px;overflow:auto;margin-top:6px;line-height:1.7;background:#f7f9fb;border-radius:8px;padding:8px 10px}

.dsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dsum div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.dsum b{display:block;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.dsum .a b{color:#1f9d55}.dsum .c b{color:#e08a00}.dsum .r b{color:#c0392b}
table.diff{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
table.diff th,table.diff td{border-bottom:1px solid #eef1f4;padding:7px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
table.diff th{background:#f7f9fb;color:#3b4756;font-weight:700;position:sticky;top:57px}
table.diff col.k{width:64px}table.diff col.p{width:34%}table.diff col.n{width:22%}
.kind{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;color:#fff}
.kind.a{background:#1f9d55}.kind.c{background:#e08a00}.kind.r{background:#c0392b}
.old{color:#9aa5b2;text-decoration:line-through}
.drop{position:fixed;inset:0;background:rgba(15,138,131,.18);border:4px dashed var(--teal);z-index:60;display:none;
  align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--navy)}
.drop.show{display:flex}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1c2430;color:#fff;
  padding:11px 18px;border-radius:10px;font-size:14.5px;opacity:0;transition:.2s;z-index:70;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:#fff4d6;color:#7a5200;font-size:13px;padding:8px 20px;text-align:center;display:none}
.dsheet{position:fixed;inset:0;background:rgba(18,28,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:65}
.dsheet.show{display:flex}
.dbox{background:#fff;width:min(520px,100%);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.dbox .dt{font-weight:700;color:var(--navy);margin-bottom:12px;font-size:15px}
.dbox .dl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:55vh;overflow:auto}
.dn{height:58px;border:1px solid #cfd8e3;background:#f2f6fa;border-radius:10px;font-size:18px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dn small{font-size:11.5px;font-weight:500;color:var(--muted)}
.dcopy{margin-top:12px;width:100%;height:46px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:600;color:#3b4756}
.staff{margin-top:3px;display:flex;flex-direction:column;gap:2px}
.staff .st{font-size:12.5px;color:#2f4a63;line-height:1.45}
.staff .st b{font-weight:700;color:#1f3a5f}
.staff .st i{font-style:normal;color:var(--muted);font-size:11.5px}
.nm .ttl{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.gh.staffg{background:#eef7f1}.gh.staffg .path{color:#1f6b44}
.stbtn{margin-top:4px;border:1px solid #cfe3e1;background:#f0f8f7;color:#0b6d67;border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer}
.relbox{column-span:all;margin:4px 0 14px;text-align:center}
.relbtn{width:100%;border:1px dashed #9fcfca;background:#f4fbfa;color:#0b6d67;border-radius:10px;padding:11px 14px;font-size:14px;cursor:pointer;line-height:1.5;word-break:keep-all}
.relbtn b{color:#1f3a5f}
.grid.flat .relbox{margin-top:0}
.sub.why{color:#0b6d67}
footer .dates{font-size:11.5px;color:var(--muted);margin:0 0 4px;line-height:1.6}
footer .dates span{white-space:nowrap}
footer .disc{color:#8a5a00;background:#fff8e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin:0 auto 10px;max-width:640px;line-height:1.5;word-break:keep-all}
@media (max-width:640px){
  header{padding:14px 14px 12px}.swrap,main{padding-left:12px;padding-right:12px}
  .hinfo{margin-left:0;width:100%}
  .btn .lbl{display:none}
  .btn{padding:0 13px}
  .grid{columns:1}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-12px;padding-right:12px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .sbox input{height:44px;font-size:16px}.btn{height:44px}.sclear{top:6px}
  .nums{max-width:170px}
  .form{grid-template-columns:1fr}.form label{text-align:left}.form .hint{grid-column:1}
  .quick{grid-template-columns:1fr}.quick .lb{padding-top:0}
  table.diff col.p{width:30%}
}
@media print{
  .searchbar,.more,.star,footer,.warn,.quick{display:none!important}
  header{background:none;color:#000}.pill{border:1px solid #999}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htop">
      <h1>원내 전화번호 검색</h1>
      <span class="base" id="baseLbl"></span>
      <div class="hinfo" id="hinfo"></div>
    </div>
    <div class="cmc" id="cmcLbl"></div>
  </div>
</header>

<div class="searchbar">
  <div class="swrap">
    <div class="srow">
      <div class="sbox">
        <input id="q" type="text" enterkeyhint="search" autocomplete="off" placeholder="이름 · 부서 · 업무 · 번호 · 초성 — 한/영 안 바꿔도, 조금 틀려도 찾습니다">
        <button class="sclear" id="qclear" title="지우기 (Esc)">✕</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
        <div class="status">
      <span><span id="statusL"></span><span id="notice"></span></span>
      <span id="statusR"></span>
    </div>
  </div>
</div>

<main><div class="grid" id="list"></div></main>
<footer><div class="disc">⚠ 연락처 정보는 사용자가 입력한 대로 보여주기에 실제와 다를 수 있습니다.</div><div class="dates" id="dateLbl"></div>개발자 노상엽</footer>

<div class="dsheet" id="dialSheet"><div class="dbox"><div class="dt"></div><div class="dl"></div><button class="dcopy">닫기</button></div></div>

// ===== 원내 전화번호부(병원 배치형) 파서 =====
function cleanText(s){
  if(s==null) return '';
  s=String(s).replace(/ /g,' ').replace(/\s+/g,' ').trim();
  const t=s.split(' ');
  if(t.length>1 && t.every(x=>x.length===1 && x!=='…' && x!=='〃')) s=t.join('');
  return s;
}
const NUM_RE=/(?:^|\s)(\d{4}(?:\s*[~,.]\s*\d{1,4})*)\s*(\([^)]*\))?\s*$/;
function splitNumber(text){ // "회복실 2156, 2145" -> {name, num, note}
  const raw=String(text).replace(/ /g,' ');
  const m=raw.match(NUM_RE);
  if(!m) return null;
  return {name:cleanText(raw.slice(0,m.index)), num:m[1], note:m[2]?m[2].replace(/[()]/g,'').trim():''};
}
function parseNumbers(str){ // "2011~8" / "2287. 2091" / "7633,7393"
  const out=[];
  String(str).split(/[,.]/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
    const m=p.match(/^(\d{4})\s*~\s*(\d{1,4})$/);
    if(m){
      const a=m[1], b=a.slice(0,4-m[2].length)+m[2];
      const s=+a, e=+b, list=[];
      if(e>s && e-s<=30){ for(let i=s;i<=e;i++) list.push(String(i)); out.push({disp:a+'~'+b, list}); }
      else out.push({disp:p, list:[a]});
    } else if(/^\d{3,}$/.test(p)) out.push({disp:p, list:[p]});
    else out.push({disp:p, list:[]});
  });
  return out;
}
function isLayoutGrid(grid){
  return grid.some(row=>row.some(v=>v && /^\s*\[.+\]\s*$/.test(v)));
}
function parseLayoutGrid(grid){
  const info=[]; let baseDate='';
  (grid[0]||[]).forEach(v=>{ if(v){ info.push(cleanText(v)); const d=String(v).match(/(\d{2,4})\.\s*(\d{1,2})\.\s*(\d{1,2})\s*기준/); if(d) baseDate=d[0].replace(/\s*기준/,''); }});
  const nCols=Math.max(...grid.map(r=>r.length));
  const pairs=Math.ceil(nCols/2);
  const divAt=[]; // divAt[p] = [{row, name}]
  for(let p=0;p<pairs;p++){
    divAt[p]=[];
    for(let r=1;r<grid.length;r++){
      const a=grid[r][2*p];
      if(a && /^\s*\[.+\]\s*$/.test(a)) divAt[p].push({row:r,name:cleanText(a.replace(/[\[\]]/g,''))});
      else if(a && /^기타$/.test(cleanText(a))) divAt[p].push({row:r,name:'기타'});
    }
  }
  function divisionFor(p,r){
    for(let q=p;q>=0;q--){
      const list=divAt[q].filter(d=>d.row<=r);
      if(list.length) return list[list.length-1].name;
    }
    return '';
  }
  const entries=[]; let carry=null; // 이전 열 마지막 부서 이어받기
  for(let p=0;p<pairs;p++){
    let div='', dept='', sub='', hasSubs=false, prev='start', last=null, pending=null, lastBase='';
    let started=false;
    const ctx=()=>({div,dept,sub,hasSubs});
    const add=(name,numStr,note)=>{
      let nm=cleanText(name);
      if(nm.includes('〃')){
        const base=lastBase||'';
        nm = nm.replace(/〃/g,'').trim()==='' ? base : cleanText(nm.replace('〃', (base.split(' ')[0]||''))) ;
      } else lastBase=nm;
      const nums=numStr!=null? parseNumbers(numStr):[];
      let nt=note||'';
      if(numStr!=null && nums.every(n=>n.list.length===0) && !/\d/.test(numStr)){ nt=(nt?nt+' · ':'')+cleanText(numStr); nums.length=0; }
      const e={name:nm, div, dept, sub, nums, note:nt};
      entries.push(e); last=e; prev='entry'; return e;
    };
    for(let r=1;r<grid.length;r++){
      const a=grid[r][2*p], b=grid[r][2*p+1];
      const at=a!=null && String(a).trim()!=='' ? String(a) : null;
      const bt=b!=null && String(b).trim()!=='' ? String(b) : null;
      if(!at && !bt){ if(prev!=='header') prev='blank'; continue; }
      const d=divisionFor(p,r);
      if(!started){
        started=true;
        if(carry && d===carry.div && !(at && (/^\s*\[.+\]\s*$/.test(at)))){ dept=carry.dept; sub=carry.sub; hasSubs=carry.hasSubs; }
      }
      if(d!==div){ div=d; }
      if(at && /^\s*\[.+\]\s*$/.test(at)){ div=cleanText(at.replace(/[\[\]]/g,'')); dept=sub=''; hasSubs=false; prev='div'; pending=null; continue; }
      if(at && cleanText(at)==='기타'){ div='기타'; dept=sub=''; hasSubs=false; prev='div'; pending=null; continue; }
      if(bt){ // 번호 칸 있음
        if(!at){
          if(prev==='header' && pending){ if(!(pending.prevKind==='blank'||pending.prevKind==='div')) applyCtx(pending.before); add(pending.text,bt,''); pending=null; }
          else if(last){ last.nums.push(...parseNumbers(bt)); }
          continue;
        }
        add(at,bt,''); pending=null; continue;
      }
      // 이름 칸만 있음
      const sp=splitNumber(at);
      if(sp && sp.name===''){ // 번호만 있는 줄
        if(prev==='header' && pending){
          if(/대표/.test(sp.note)){ add(pending.text+' (대표)', sp.num, ''); }
          else if(pending.prevKind==='blank'||pending.prevKind==='div'){ add(pending.text, sp.num, sp.note); }
          else { applyCtx(pending.before); add(pending.text, sp.num, sp.note); }
          pending=null;
        } else if(last){ last.nums.push(...parseNumbers(sp.num)); if(sp.note) last.note=(last.note?last.note+' · ':'')+sp.note; }
        continue;
      }
      if(sp){ add(sp.name, sp.num, sp.note); pending=null; continue; }
      const txt=cleanText(at);
      if(/^\(.*\)$/.test(txt) && last){ last.note=(last.note?last.note+' · ':'')+txt.replace(/[()]/g,''); continue; }
      if(prev==='entry' && last && /,\s*$/.test(last.name+' ') && /,$/.test(last.name)){ last.name=cleanText(last.name+' '+txt); continue; }
      // 머리글(부서)
      const before=ctx(); const prevKind=prev;
      if(prev==='header'){ sub=txt; hasSubs=true; }
      else if(hasSubs && /unit|병동|중환자실/i.test(txt)){ sub=txt; }
      else { dept=txt; sub=''; hasSubs=false; }
      pending={text:txt,before,prevKind}; prev='header';
    }
    carry={div,dept,sub,hasSubs};
    function applyCtx(c){ div=c.div; dept=c.dept; sub=c.sub; hasSubs=c.hasSubs; }
  }
  return {info, baseDate, entries};
}

const DV={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};

const DJsplit=Object.fromEntries(Object.entries(DJ).map(([k,v])=>[v,[k[0],k[1]]]));
function engToKor(str){
  let out='',c=null,v=null,f=null;
  const flush=()=>{ if(c&&v){ out+=String.fromCharCode(0xAC00+CHO.indexOf(c)*588+JUNG.indexOf(v)*28+Math.max(0,JONG.indexOf(f||''))); }
    else { if(c) out+=c; if(v) out+=v; } c=v=f=null; };
  for(const ch of str){
    const k=KEYMAP[ch]||KEYMAP[ch.toLowerCase()];
    if(!k){ flush(); out+=ch; continue; }
    const vowel=JUNG.includes(k);
    if(!vowel){
      if(c&&v&&!f){ if(JONG.includes(k)) f=k; else { flush(); c=k; } }
      else if(c&&v&&f){ const d=DJ[f+k]; if(d) f=d; else { flush(); c=k; } }
      else { flush(); c=k; }
    } else {
      if(c&&v&&f){ if(DJsplit[f]){ const [a,b]=DJsplit[f]; f=a; flush(); c=b; v=k; } else { const nf=f; f=null; flush(); c=nf; v=k; } }
      else if(c&&v){ const d=DV[v+k]; if(d) v=d; else { flush(); v=k; } }
      else if(c){ if(CHO.includes(c)) v=k; else { flush(); v=k; } }
      else if(v){ const d=DV[v+k]; if(d) v=d; else { flush(); v=k; } }
      else v=k;
    }
  }
  flush(); return out;
}
// 근사 부분문자열 거리 (오타 허용)
function approxDist(p,t){
  const m=p.length; if(!m) return 0;
  let prev=new Array(m+1); for(let i=0;i<=m;i++) prev[i]=i;
  let best=prev[m];
  for(let j=0;j<t.length;j++){ const ch=t[j]; const cur=new Array(m+1); cur[0]=0;
    for(let i=1;i<=m;i++) cur[i]=Math.min(prev[i]+1,cur[i-1]+1,prev[i-1]+(p[i-1]===ch?0:1));
    if(cur[m]<best) best=cur[m]; prev=cur; }
  return best;
}

function wardKw(text){
  const out=[]; const re=/([가나])\s*(\d{1,2})(?:\s*~\s*[가나]?\s*(\d{1,2}))?(?!\d)/g; let m;
  while((m=re.exec(String(text||'')))){ const a=+m[2], b=m[3]?+m[3]:a; if(a<1||b>19||b<a) continue; for(let i=a;i<=b;i++) out.push(m[1]+String(i).padStart(2,'0')+'병동'); }
  return [...new Set(out)];
}

function codeKw(text){ const out=[]; String(text||'').replace(/[A-Za-z]{2,5}/g,w=>{ const k=CODE_KW[w.toUpperCase()]; if(k) out.push(k); }); return out; }
function staffEntries(){

    let p=null;
    if(pa){ const [kind,pdept,prof,ward,etc]=pa.split('|'); p={kind,dept:pdept,prof,ward,etc}; }
    const notes=[]; if(p) notes.push(p.kind); if(status) notes.push(status);

      const parts=String(p.prof||'').split(',').map(x=>x.trim()).filter(Boolean);

      if(moved){ const mm=String(p.prof).match(/(\d{4})\.(\d{1,2})\.(\d{1,2})\s*\(?\s*(.+?)\s*이동/); profTxt=mm?`→ ${mm[4]} 이동(${mm[1]}. ${+mm[2]}. ${+mm[3]}.)`:p.prof; }

function attachStaff(list){
  const byExt=new Map(), byWard=new Map();
  list.filter(e=>e.src==='staff'&&!e.nolink).forEach(s=>{
    if(s.ext){ if(!byExt.has(s.ext)) byExt.set(s.ext,[]); byExt.get(s.ext).push(s); }
    if(s.dept==='원무팀'||s.dept==='원목팀') wardKw(s.memo).forEach(w=>{ if(!byWard.has(w)) byWard.set(w,[]); byWard.get(w).push(s); });
  });
  // 담당업무에 적힌 교수 이름 → 교수 연구실 항목과 잇기
  const staffNames=new Set(list.filter(e=>e.src==='staff').map(e=>e.name));
  const profs=new Map(); list.filter(e=>e.src==='base'&&e.div==='교수 연구실'&&/^[가-힣]{2,4}$/.test(e.name)).forEach(e=>{ if(!profs.has(e.name)) profs.set(e.name,[]); profs.get(e.name).push(e); });
  const byProf=new Map();   // 교수 연구실 항목 → 담당자들
  list.filter(e=>e.src==='staff'&&e.memo).forEach(s=>{
    const m=s.memo, hits=[];
    profs.forEach((_,pn)=>{
      let i=m.indexOf(pn);
      while(i>=0){
        const before=m[i-1]||'', after=m[i+pn.length]||'';
        const okB=!/[가-힣]/.test(before);
        const okA=pn.length>=3||!/[가-힣]/.test(after)||/^(교|선)/.test(m.slice(i+pn.length));
        const inParen=(m.slice(0,i).split('(').length-1)>(m.slice(0,i).split(')').length-1);
        const viaPA=(s.paProfs||[]).includes(pn);
        const okCtx=!staffNames.has(pn)||(inParen&&/pf|교수|prof/i.test(m))||viaPA;
        if(okB&&okA&&okCtx){ hits.push({pn,strict:staffNames.has(pn)&&viaPA&&!(inParen&&/pf|교수|prof/i.test(m))}); break; }
        i=m.indexOf(pn,i+1);
      }
    });
    // 같은 이름 교수가 여러 과에 있거나(예: 내과·외과 김영민) 직원과 이름이 같으면 과를 따져 고름
    const f=deptFam(s.ctx||'');
    const uniq=hits.filter(h=>profs.get(h.pn).length===1).map(h=>profs.get(h.pn)[0].dept);
    hits.forEach(({pn,strict})=>{
      let c=profs.get(pn);
      if(c.length>1||strict){
        const c2=f.size?c.filter(x=>f.has(x.dept)):c;
        if(strict&&f.size&&!c2.length) return;      // 과가 맞지 않으면 잇지 않음
        c=c2.length?c2:c;
        if(c.length>1&&uniq.length){ const cnt=x=>uniq.filter(d=>d===x.dept).length; const mx=Math.max(...c.map(cnt)); if(mx>0) c=c.filter(x=>cnt(x)===mx); }
      }
      c.forEach(pe=>{ if(!byProf.has(pe)) byProf.set(pe,[]); if(!byProf.get(pe).includes(s)) byProf.get(pe).push(s); });
      s.profs=(s.profs||[]); if(!s.profs.includes(pn)) s.profs.push(pn);
    });
  });
  list.forEach(e=>{
    if(e.src!=='base') return;
    const seen=new Set(), people=[];
    const sk=s=>s.name+'|'+(s.ext||'');   // 같은 사람이 두 부서에 올라 있으면 한 번만
    if(e.div==='교수 연구실') (byProf.get(e)||[]).forEach(s=>{ if(!seen.has(sk(s))){ seen.add(sk(s)); people.push({s,why:'prof'}); } });
    (e.nums||[]).forEach(n=>n.list.forEach(x=>(byExt.get(x)||[]).forEach(s=>{ if(!seen.has(sk(s))){ seen.add(sk(s)); people.push({s,why:'ext'}); } })));
    const wm=String(e.name).match(/^[가나]\d{2}병동$/);
    if(wm) (byWard.get(wm[0])||[]).forEach(s=>{ if(!seen.has(sk(s))){ seen.add(sk(s)); people.push({s,why:'ward'}); } });
    e.staff=people;
    if(/응급원무/.test([e.dept,e.sub,e.name].join(' ')) && !/3교대/.test(e.note||'')) e.note=(e.note?e.note+' · ':'')+'3교대';
  });
}

// 한 낱말이 한 항목에 맞는 점수 (0 = 안 맞음)
function termScore(e,t){
  if(t==='pa'||t==='sa') return (e.src==='staff'&&new RegExp('(^| )'+t.toUpperCase()+'( |$)').test(e.note||''))?60:0;
  if(/^\d+$/.test(t)){
    if(e.numHay.includes(t)) return 95;
    if(e.numHay.some(n=>n.includes(t))) return 45;
    return e.hay.includes(t)?20:0;
  }
  if(isCho(t)){
    if(e.cName===t) return 70; if(e.cName.startsWith(t)) return 55; if(e.cName.includes(t)) return 40;
    return e.hayCho.includes(t)?18:0;
  }
  if(e.nName===t) return 100; if(e.nName.startsWith(t)) return 72; if(e.nName.includes(t)) return 52;
  if(e.nDept===t) return 46; if(e.nDept.includes(t)) return 32;
  if(e.nDiv.includes(t)) return 16;
  if(e.nMemo.includes(t)) return 14;
  if(e.hayCho.includes(t)) return 8;
  return 0;
}
// 낱말 하나에 대한 대안(원래·별칭·자판변환) → 가장 높은 점수
function termVariants(t){
  const v=[{t,w:1,how:''}];
  const al=aliasMap.get(t); if(al) al.forEach(x=>{ if(x!==t) v.push({t:x,w:.85,how:'alias'}); });
  return v;
}
function scoreWith(e,variants){ let best=0; for(const v of variants){ const s=termScore(e,v.t)*v.w; if(s>best) best=s; } return best; }
let searchNote='';
function search(q,pool){
  searchNote='';
  let raw=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!raw.length) return null;
  // 통째 별칭 (예: '의무기록 사본')
  const joined=norm(q);
  if(raw.length>1&&(aliasMap.has(joined)||wardAlias(joined))) raw=[joined];
  const wards=[];
  const wardMiss=[];
  raw=raw.map(t=>{ const w=wardAlias(t); if(w){ if(all.some(e=>e.hay.includes(w))){ wards.push([t,w]); return w; } wardMiss.push([t,w]); } return t; });
  let terms=raw.filter(t=>!STOP.has(t)); if(!terms.length) terms=raw;
  const conv=[];
  let tv=terms.map(t=>termVariants(t));
  const run=tvs=>{ const out=[]; for(const e of pool){ let sum=0,ok=true; for(const vs of tvs){ const s=scoreWith(e,vs); if(!s){ok=false;break;} sum+=s; } if(ok) out.push({e,s:sum}); } return out; };
  // 영문 자판 낱말 중 아무 데도 안 맞는 것은 한글로 바꿔 보기
  tv=tv.map((vs,i)=>{
    const t=terms[i];
    if(/^[a-z]+$/i.test(t) && !all.some(e=>scoreWith(e,vs))){
      const k=norm(engToKor(t));
      const wk=wardAlias(k); if(wk&&all.some(e=>e.hay.includes(wk))){ conv.push([t,wk]); return [{t:wk,w:1,how:'kbd'}]; }
      if(/[가-힣ㄱ-ㅎ]/.test(k)){ conv.push([t,k]); return termVariants(k).map(x=>Object.assign(x,{how:x.how||'kbd'})); }
    }
    return vs;
  });
  let res=run(tv);
  if(conv.length) searchNote=`한/영 자판 자동 변환: ${conv.map(([a,b])=>`‘${a}’→‘${b}’`).join(', ')}`;
  if(wards.length) searchNote=(searchNote?searchNote+' · ':'')+wards.map(([a,b])=>`‘${a}’→${b}`).join(', ');
  if(!res.length && wardMiss.length){
    const have=[...new Set(all.map(e=>(e.name.match(/^[가나]\d{2}병동$/)||[])[0]).filter(Boolean))].sort();
    searchNote=wardMiss.map(([a,w])=>`‘${a}’→${w}은(는) 전화번호부에 없습니다`).join(', ')+(have.length?` (있는 병동: ${have.join(', ')})`:'');
    return {res:[],terms:[]};
  }
  if(!res.length){ // 오타 허용 — 낱말을 붙여 자모 단위로 비슷한 것 찾기
    const p=jamo(norm(conv.length?terms.map(t=>{const c=conv.find(x=>x[0]===t);return c?c[1]:t;}).join(''):q));
    if(p.length>=4){
      const k=p.length<=6?1:p.length<=10?2:3;
      const fz=[];
      for(const e of pool){ const dn=approxDist(p,e.jName); const d=dn<=k?dn:approxDist(p,e.jAll); if(d<=k) fz.push({e,s:(k+1-d)*20-(dn<=k?0:5),fz:true}); }
      if(fz.length){ res=fz; searchNote=(searchNote?searchNote+' · ':'')+'정확히 맞는 결과가 없어 비슷한 이름을 보여 줍니다'; }
    }
  }
  // 자주 쓰는 번호·즐겨찾기 가산
  res.forEach(r=>{ const u=usage[r.e.key]; if(u) r.s+=Math.min(30,u[0]*4); if(favs.has(r.e.key)) r.s+=10; });
  res.forEach(r=>{ r.direct=r.fz||tv.every(vs=>vs.some(v=>termScoreDirect(r.e,v.t)>0)); });
  res.sort((a,b)=>b.s-a.s);
  return {res,terms:tv.flat().map(v=>v.t)};
}

// ===== 그리기 =====
function hl(text,terms){
  let s=esc(text);
  const ts=[...new Set(terms)].filter(t=>t&&!isCho(t)&&!/^\d+$/.test(t)).sort((a,b)=>b.length-a.length);
  ts.forEach(t=>{
    const pat=[...t].map(c=>esc(c).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*');
    try{ s=s.replace(new RegExp('('+pat+')(?![^<]*>)','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return s;
}
function rowHTML(e,terms,showPath){
  const nums=e.nums.length?e.nums.map(n=>`<button class="num" data-copy="${esc(n.disp)}" title="${CAN_DIAL?'눌러서 전화':'눌러서 복사'}">${esc(n.disp)}</button>`).join(''):`<span class="num none">${e.note&&e.src!=='staff'?esc(e.note):'번호 없음'}</span>`;
  const path=(showPath?`<div class="sub">${esc(e.group)}</div>`:'')+(e._why?`<div class="sub why">🔗 ${esc(e._why)}</div>`:'');
  const note=e.note&&(e.nums.length||e.src==='staff')?`<span class="note">${esc(e.note)}</span>`:'';
  const tag=e.badge==='a'?'<span class="tag new">신규</span>':e.badge==='c'?'<span class="tag chg">변경</span>':e.badge==='m'?'<span class="tag new">이동</span>':'';
  const src=showPath?'':'';
  const by=e.src==='share'&&e.by?` · ${esc(e.by)} 추가`:'';
  const memo=e.memo||by?`<div class="memo">${e.memo?(e.src==='staff'?'':'✎ ')+hl(e.memo,terms):''}${by?`<span style="color:var(--muted)">${e.memo?by:by.slice(3)}</span>`:''}</div>`:'';
  return `<div class="row" data-key="${esc(e.key)}">
    <button class="star${favs.has(e.key)?' on':''}" data-star="${esc(e.key)}" title="즐겨찾기">${favs.has(e.key)?'★':'☆'}</button>
    <div class="nm"><div class="n">${hl(e.name,terms)}${e.title?`<span class="ttl">${esc(e.title)}</span>`:''}${note}${tag}${src}</div>${path}${memo}${staffToggleHTML(e,terms)}</div>
    <div class="nums">${nums}</div>
  </div>`;
}
function groupClass(g){ if(g.startsWith('담당자')) return ' staffg'; return g.startsWith('추가 번호')?' mine':g.startsWith('공용 번호')?' share':(g.startsWith('★')||g.startsWith('🔥'))?' hot':''; }
function groupHTML(g,items,terms,showPath){
  const parts=g.split(' › ');
  const path=parts.map((p,i)=>i===0&&parts.length>1?`<span class="div">${esc(p)}</span>`:esc(p)).join('<span class="sep">›</span>');
  return `<section class="group"><div class="gh${groupClass(g)}"><span class="path" title="${esc(g)}">${path}</span><span class="cnt">${items.length}</span></div>${items.map(e=>rowHTML(e,terms,showPath)).join('')}</section>`;
}
const QUICK=[['증명서·진단서','증명서발급'],['진료기록 사본','진료기록사본'],['영상 CD','영상자료'],['입원 수속','입원수속'],['퇴원','퇴원업무'],['산재','산업재해'],['자동차보험','자동차보험'],['응급원무','응급원무'],['PC 고장','pc고장'],['급여','급여'],['주차','주차관리'],['시설 고장','시설팀'],['보안','보안'],['장례식장','장례식장'],['종합안내','종합안내']];
let lastResults=[];
function render(){
  const q=$('q').value.trim();
  $('qclear').style.display=q?'block':'none';
  const pool=all.filter(e=>inFilter(e,filter));
  const sr=search(q,pool);
  const terms=sr?sr.terms:[];
  $('notice').innerHTML=searchNote?`<span class="notice">${esc(searchNote)}</span>`:'';
  let html='';
  const list=$('list');
  if(sr){
    if(relQ!==q){ relQ=q; showRel=false; }
    const hasDirect=sr.res.some(r=>r.direct);
    const res=sr.res.filter(r=>!hasDirect||r.direct).map(r=>r.e);
    const relRes=[]; const seenRel=new Set(res.map(e=>e.key));
    const labOf=s=>s.dept==='원무팀'?'원무 담당':s.dept==='원목팀'?'원목 담당':s.dept==='외래간호팀'?'외래 담당':s.dept==='전문진료지원팀'?(/PA/.test(s.note||'')?'PA':'전담간호사'):s.dept==='CRC'?'CRC':s.dept==='수술간호팀'?'수술':'담당';
    res.forEach(e=>(e.staff||[]).forEach(({s})=>{ if(!seenRel.has(s.key)){ seenRel.add(s.key); relRes.push(Object.assign({},s,{_why:`${e.div==='교수 연구실'?e.dept+' ':''}${e.name}${e.div==='교수 연구실'?' 교수':''} ${labOf(s)}`})); } }));
    if(hasDirect) sr.res.filter(r=>!r.direct).forEach(r=>{ if(!seenRel.has(r.e.key)){ seenRel.add(r.e.key); relRes.push(r.e); } });
    lastResults=res;
    $('statusL').textContent=`검색 결과 ${res.length}건`+(relRes.length?` · 관련 ${relRes.length}건`:'');
    $('statusR').innerHTML=`<span class="seg"><button data-view="rel" class="${view==='rel'?'on':''}">관련도순</button><button data-view="group" class="${view==='group'?'on':''}">부서별</button></span>`;
    if(!res.length){
      list.className='grid';
      list.innerHTML=`<div class="empty"><b>‘${esc(q)}’</b>에 맞는 번호가 없습니다.<br><br>부서 이름이나 업무(예: 증명서, 산재)로 찾아보거나,<br>초성(예: ㅇㅁㅌ)으로도 찾아보세요.</div>`;
      selIdx=-1; return;
    }
    if(view==='rel'){
      list.className='grid flat';
      html=`<section class="group">${res.slice(0,300).map(e=>rowHTML(e,terms,true)).join('')}</section>`;
      if(res.length>300) html+=`<div class="empty" style="padding:16px">결과가 많아 300건만 보여 줍니다. 검색어를 더 넣어 보세요.</div>`;
    } else {
      list.className='grid';
      const groups=new Map(); res.forEach(e=>{ if(!groups.has(e.group)) groups.set(e.group,[]); groups.get(e.group).push(e); });
      groups.forEach((items,g)=>html+=groupHTML(g,items,terms,false));
    }
    if(relRes.length){
      html+=`<div class="relbox"><button class="relbtn" data-showrel>💡 이 정보도 필요하신가요? ‘${esc(q)}’ 관련 담당자·연결 정보 <b>${relRes.length}건</b> ${showRel?'접기 ▴':'보기 ▾'}</button></div>`;
      if(showRel) html+=`<section class="group">${relRes.slice(0,200).map(e=>rowHTML(e,terms,true)).join('')}</section>`;
    }
  } else {
    list.className='grid';
    lastResults=pool;
    $('statusL').textContent=`${filter} ${pool.length}건`;
    $('statusR').textContent=CAN_DIAL?'번호를 누르면 032-340-내선으로 전화 연결':'번호를 누르면 복사 · ↑↓ 고르고 Enter 복사 · Esc 지우기';
    if(filter==='전체'){
      html+=`<div class="quick"><div class="lb">업무로 찾기</div><div class="qs">${QUICK.filter(([,k])=>all.some(e=>e.hay.includes(norm(k)))).map(([l,k])=>`<button class="qb" data-q="${esc(k)}">${esc(l)}</button>`).join('')}</div>`
        +(recent.length?`<div class="lb">최근 검색</div><div class="qs">${recent.map(r=>`<button class="qb rc" data-q="${esc(r)}">${esc(r)}<span class="xx" data-rmrecent="${esc(r)}" title="지우기">✕</span></button>`).join('')}</div>`:'')+`</div>`;
      const fv=all.filter(e=>favs.has(e.key));
      if(fv.length) html+=groupHTML('★ 즐겨찾기',fv,[],true);
      const hot=all.filter(e=>!favs.has(e.key)&&usage[e.key]&&usage[e.key][0]>=2).sort((a,b)=>usage[b.key][0]-usage[a.key][0]).slice(0,8);
      if(hot.length) html+=groupHTML('🔥 자주 쓰는 번호',hot,[],true);
    }
    if(!pool.length){
      html+=`<div class="empty">${filter==='★ 즐겨찾기'?'즐겨찾기한 번호가 없습니다.<br>번호 왼쪽의 ☆를 누르면 여기에 모입니다.':filter==='공용 번호'?'아직 공용 번호가 없습니다.<br><b>＋ 번호 추가</b>에서 저장 위치를 ‘팀 공용’으로 고르세요.':'추가한 번호가 없습니다.<br><b>＋ 번호 추가</b>로 원내 전화번호부에 없는 번호를 넣어 보세요.'}</div>`;
    } else if(filter==='★ 즐겨찾기'){ html=groupHTML('★ 즐겨찾기',pool,[],true); }
    else {
      const groups=new Map(); pool.forEach(e=>{ if(!groups.has(e.group)) groups.set(e.group,[]); groups.get(e.group).push(e); });
      groups.forEach((items,g)=>html+=groupHTML(g,items,[],filter==='최근 변경'));
    }
  }
  list.innerHTML=html;
  selIdx=-1;
}
function moveSel(d){
  const rows=[...document.querySelectorAll('#list .row')]; if(!rows.length) return;
  rows.forEach(r=>r.classList.remove('sel'));
  selIdx=Math.max(0,Math.min(rows.length-1,selIdx+d));
  rows[selIdx].classList.add('sel'); rows[selIdx].scrollIntoView({block:'nearest'});
}

// ===== 복사·사용 기록 =====
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}
function copy(text,key){
  const done=()=>toast(`${text}  복사됨`);
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback);}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast(text);}ta.remove();}
  if(key){ const u=usage[key]||[0,0]; usage[key]=[u[0]+1,Date.now()]; LS.set('usage',usage); }
  const q=$('q').value.trim();
  if(q){ recent=[q,...recent.filter(r=>r!==q)].slice(0,8); LS.set('recent',recent); }
}

// ===== 이벤트 =====
let tmr; $('q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(render,70);});
$('q').addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ $('q').value=''; render(); }
  else if(ev.key==='ArrowDown'){ ev.preventDefault(); moveSel(1); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); moveSel(-1); }
  else if(ev.key==='Enter'){
    const rows=[...document.querySelectorAll('#list .row')];
    const row=selIdx>=0?rows[selIdx]:rows.find(r=>r.querySelector('.num:not(.none)'));
    const b=row&&row.querySelector('.num:not(.none)'); if(b) copy(b.dataset.copy,row.dataset.key);
  }
});
$('qclear').onclick=()=>{$('q').value='';render();$('q').focus();};
document.addEventListener('keydown',ev=>{
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')) return;
  if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(ev.key.length===1||ev.key==='Process'){ $('q').focus(); }
  if(ev.key==='Escape'){ $('q').value=''; render(); }
});
$('chips').addEventListener('click',ev=>{const b=ev.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;renderChips();render();});
document.addEventListener('click',ev=>{
  const sk=ev.target.closest('[data-staffkey]'); if(sk){ const k=sk.dataset.staffkey; openStaff.has(k)?openStaff.delete(k):openStaff.add(k); render(); return; }
  const sr0=ev.target.closest('[data-showrel]'); if(sr0){ showRel=!showRel; render(); return; }
  const rr=ev.target.closest('[data-rmrecent]'); if(rr){ ev.stopPropagation(); recent=recent.filter(r=>r!==rr.dataset.rmrecent); LS.set('recent',recent); render(); return; }
  const qb=ev.target.closest('[data-q]'); if(qb){ $('q').value=qb.dataset.q; render(); $('q').focus(); return; }
  const vw=ev.target.closest('[data-view]'); if(vw){ view=vw.dataset.view; LS.set('view',view); render(); return; }
  const c=ev.target.closest('[data-copy]'); if(c){ const row=c.closest('.row'); if(c.classList.contains('num')) pressNumber(c.dataset.copy,row&&row.dataset.key,row&&row.querySelector('.n')&&row.querySelector('.n').innerText); else if(c.dataset.tel&&CAN_DIAL) dial(c.dataset.tel); else copy(c.dataset.copy,row&&row.dataset.key); return; }
  const s=ev.target.closest('[data-star]'); if(s){const k=s.dataset.star;favs.has(k)?favs.delete(k):favs.add(k);LS.set('favs',[...favs]);renderChips();render();return;}
});

// ===== 번호 누르면 전화 연결 (휴대폰) =====
// 4자리 내선은 032-340-내선으로, 그 밖의 번호는 적힌 그대로 건다. PC에서는 복사.
const CAN_DIAL=matchMedia('(pointer:coarse)').matches;
function dialList(disp){
  const s=String(disp).trim();
  const m=s.match(/^(\d{4})\s*~\s*(\d{4})$/);
  if(m){ const a=+m[1], b=+m[2], out=[]; for(let i=a;i<=b&&out.length<31;i++) out.push(String(i)); return out; }
  return [s];
}
function telOf(n){
  const d=String(n).replace(/[^\d]/g,'');
  if(/^\d{4}$/.test(d)) return '032340'+d;
  return d.length>=7?d:'';
}
const fmtTel=t=>t.startsWith('032340')?'032-340-'+t.slice(6):t.replace(/^(02|0\d{2}|1\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3');
function dial(n,key){
  const t=telOf(n); if(!t){ copy(n,key); return; }
  if(key){ const u=usage[key]||[0,0]; usage[key]=[u[0]+1,Date.now()]; LS.set('usage',usage); }
  const q=$('q').value.trim(); if(q){ recent=[q,...recent.filter(r=>r!==q)].slice(0,8); LS.set('recent',recent); }
  location.href='tel:'+t;
}
function pressNumber(disp,key,title){
  if(!CAN_DIAL){ copy(disp,key); return; }
  const list=dialList(disp);
  if(list.length===1){ dial(list[0],key); return; }
  // 여러 번호(예: 2011~2018) → 고르기
  const sh=$('dialSheet');
  sh.querySelector('.dt').textContent=(title||'')+' — 걸 번호를 고르세요';
  sh.querySelector('.dl').innerHTML=list.map(n=>`<button class="dn" data-dial="${esc(n)}">${esc(n)}<small>${esc(fmtTel(telOf(n)))}</small></button>`).join('');
  sh.dataset.key=key||''; sh.classList.add('show');
}
document.addEventListener('click',ev=>{
  const sh=$('dialSheet'); if(!sh||!sh.classList.contains('show')) return;
  const b=ev.target.closest('[data-dial]');
  if(b){ ev.stopPropagation(); sh.classList.remove('show'); dial(b.dataset.dial,sh.dataset.key); return; }
  if(ev.target.closest('.dcopy')){ ev.stopPropagation(); sh.classList.remove('show'); return; }
  if(ev.target===sh){ sh.classList.remove('show'); }
},true);
// ===== 시작 =====
buildAliases();
loadBase(); build();
if(!matchMedia('(max-width:640px)').matches) setTimeout(()=>$('q').focus(),50);

// ===== 뒤로가기 두 번 눌러야 종료 =====
// 안드로이드 크롬(120 이상): CloseWatcher가 휴대폰 뒤로 버튼을 먼저 받아 주므로 앱을 열자마자 눌러도 바로 꺼지지 않음.
// 그 밖의 브라우저: 탭·클릭(사용자 활성화) 때 뒤로가기 칸을 하나 걸어 둠.
(function(){
  const inApp=()=>{ const ds=document.getElementById('dialSheet'); if(ds&&ds.classList.contains('show')){ ds.classList.remove('show'); return '번호 고르기를 닫았습니다'; } const q=document.getElementById('q'); if(q&&q.value){ q.value=''; render(); window.scrollTo(0,0); return '검색어를 지웠습니다'; } return ''; };
  const EXIT='뒤로 버튼을 한 번 더 누르면 종료됩니다';
  const touch=matchMedia('(pointer:coarse)').matches;
  if(typeof CloseWatcher==='function' && touch){
    let w=null;
    const make=()=>{ if(w) return; try{ w=new CloseWatcher(); w.onclose=()=>{ w=null; const m=inApp(); if(m){ toast(m); make(); } else toast(EXIT); }; }catch(e){ w=null; } };
    make();
    ['click','touchend','pointerup','keydown'].forEach(t=>addEventListener(t,()=>{ if(!w) make(); },{capture:true,passive:true}));
    return;
  }
  const guarded=()=>!!(history.state&&history.state.telguard);
  const arm=()=>{ if(!guarded()){ try{ history.pushState({telguard:1},''); }catch(e){} } };
  ['click','touchend','pointerup','keydown'].forEach(t=>addEventListener(t,arm,{capture:true,passive:true}));
  addEventListener('popstate',()=>{ if(guarded()) return; const m=inApp(); toast(m?m+' · 한 번 더 누르면 종료됩니다':EXIT); });
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
